[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tabletennis-eeg"
version = "0.1.0"
description = "Configurable analysis pipeline for real-world table-tennis EEG data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scipy==1.17.1",
  "mne==1.12.1",
  "mne-bids==0.19.0",
  "statsmodels==0.14.6",
  "pingouin==0.6.1",
  "specparam==2.0.0rc7",
  "PyYAML>=6.0,<7",
  "boto3>=1.34,<2",
  "joblib>=1.4,<2",
  "tqdm>=4.66,<5",
]

[project.scripts]
tabletennis-eeg = "tabletennis_eeg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tabletennis_eeg"]
